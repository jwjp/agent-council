name: Verify Windows MSIX compatibility trial

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/msix-trial.yml
      - scripts/build-msix-trial.ps1
      - scripts/msix-trial-launcher.rs
      - tests/msix-trial.ps1
      - tests/fixture_agent.rs
      - src-tauri/icons/**

permissions:
  contents: read

jobs:
  trial:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Package the verified Windows preview
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'AgentCouncil.exe'
          curl.exe --fail --location --retry 2 --output $exe https://github.com/jwjp/agent-council/releases/download/v3.2.0-beta.3/AgentCouncil.exe
          if ($LASTEXITCODE -ne 0) { throw 'Preview download failed.' }
          if ((Get-FileHash -LiteralPath $exe).Hash -ne 'BA43DFC42299D13458D16A20BDCEA5FEE04CA768F45169A13CE207A119F1B51D') {
            throw 'Unexpected preview executable hash.'
          }
          ./scripts/build-msix-trial.ps1 -Executable $exe -OutputDirectory .runtime-test/msix-ci
      - name: Exercise installed package, host and upgrade
        shell: pwsh
        run: ./tests/msix-trial.ps1 -PackageDirectory .runtime-test/msix-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unsigned-msix-compatibility-trial
          path: .runtime-test/msix-ci/*.msix
          include-hidden-files: true
          if-no-files-found: warn
