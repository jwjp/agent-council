name: Verify Windows MSIX compatibility trial

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/msix-trial.yml
      - scripts/build-msix-trial.ps1
      - scripts/msix-trial-launcher.rs
      - tests/msix-trial.ps1
      - tests/fixture_agent.rs
      - src-tauri/icons/**
      - src-tauri/src/main.rs
      - src-tauri/crates/council-host/src/platform.rs
      - src-tauri/crates/council-host/src/updates.rs
      - src/App.tsx

permissions:
  contents: read

jobs:
  trial:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: npm ci
      - run: npm run tauri -- build --debug --no-bundle
      - name: Package the current Windows debug executable
        shell: pwsh
        run: |
          ./scripts/build-msix-trial.ps1 -Executable src-tauri/target/debug/AgentCouncil.exe -OutputDirectory .runtime-test/msix-ci
      - name: Exercise installed package, host and upgrade
        shell: pwsh
        run: ./tests/msix-trial.ps1 -PackageDirectory .runtime-test/msix-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unsigned-msix-compatibility-trial
          path: .runtime-test/msix-ci/*.msix
          include-hidden-files: true
          if-no-files-found: warn
