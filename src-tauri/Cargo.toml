[package]
name = "agent-council"
version = "3.2.0-beta.4"
edition = "2021"
default-run = "AgentCouncil"

[workspace]
members = ["crates/council-core", "crates/council-host", "crates/council-client"]
resolver = "2"

[workspace.package]
version = "3.2.0-beta.4"
edition = "2021"

[[bin]]
name = "AgentCouncil"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["full"] }
rfd = "0.17"
open = "5"
council-host = { path = "crates/council-host" }

[profile.release]
strip = true
lto = true
codegen-units = 1
