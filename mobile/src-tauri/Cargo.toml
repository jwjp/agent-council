[package]
name = "council-companion"
version = "0.1.0-alpha.1"
edition = "2021"
[workspace]
members = ["plugins/secure-link"]
[lib]
name = "council_companion"
crate-type = ["staticlib", "cdylib", "rlib"]
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-secure-link = { path = "plugins/secure-link" }
council-client = { path = "../../src-tauri/crates/council-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros"] }
tokio-util = "0.7"
futures-util = "0.3"
[build-dependencies]
tauri-build = { version = "2", features = [] }

