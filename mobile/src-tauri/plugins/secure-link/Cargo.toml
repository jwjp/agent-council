[package]
name = "tauri-plugin-secure-link"
version = "0.1.0"
description = "Native-only connection vault for Council Companion"
edition = "2024"
rust-version = "1.90"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-secure-link"

[dependencies]
tauri = { version = "2.12.5" }
serde = "1.0"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }
